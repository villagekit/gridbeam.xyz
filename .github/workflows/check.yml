name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Reads the pnpm version from package.json's `packageManager` field.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # Cloudflare Workers Builds is meant to own the build, but connecting it is still a
      # pending user action (the release milestone in plans/), so today nothing else
      # would catch a change that typechecks and fails to build. Drop this step once Workers
      # Builds runs on every push.
      - run: pnpm build

      # `prebuild` regenerates the committed `designs-data.generated.ts`, so by here it has just
      # been rebuilt from ./products. A diff means the two have drifted apart.
      - run: git diff --exit-code app/_lib/designs-data.generated.ts
